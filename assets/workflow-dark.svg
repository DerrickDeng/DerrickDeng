<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Agentic QA workflow</title>
<desc id="desc">A Jira story becomes traceable BDD tests in ai-native-test-design, then Playwright scripts in ai-native-ui-automation. A requirement wiki gives business rules to the automation.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker></defs>
<rect x="10" y="66.0" width="160" height="76" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="90" y="98.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Jira story</text>
<text x="90" y="120.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">+ acceptance criteria</text>
<line x1="170" y1="104.0" x2="212" y2="104.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="215" y="40" width="272" height="128" rx="12" fill="#0d2847" stroke="#4493f8" stroke-width="2"/>
<text x="351.0" y="70" font-size="16" font-weight="700" fill="#79c0ff" text-anchor="middle">ai-native-test-design</text>
<text x="351.0" y="100" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">What to test</text>
<text x="351.0" y="122" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">Where to automate</text>
<text x="351.0" y="144" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">What goes into regression</text>
<line x1="487" y1="104.0" x2="529" y2="104.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="532" y="66.0" width="140" height="76" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="602" y="98.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Traceable</text>
<text x="602" y="120.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">BDD .feature</text>
<line x1="672" y1="104.0" x2="714" y2="104.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="717" y="40" width="273" height="128" rx="12" fill="#271a45" stroke="#ab7df8" stroke-width="2"/>
<text x="853.5" y="70" font-size="16" font-weight="700" fill="#d2a8ff" text-anchor="middle">ai-native-ui-automation</text>
<text x="853.5" y="111" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">BDD steps → Playwright scripts</text>
<text x="853.5" y="133" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">Heal broken tests</text>
<rect x="432" y="222" width="340" height="58" rx="12" fill="#2a2212" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="602.0" y="246" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">Requirement Wiki</text>
<text x="602.0" y="267" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">every rule cites its source story</text>
<line x1="351" y1="170" x2="472" y2="220" stroke="#656c76" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="372" y="242" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">requirements compiled into</text>
<line x1="732" y1="220" x2="853" y2="170" stroke="#656c76" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="832" y="242" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">business rules for new steps</text>
</svg>
