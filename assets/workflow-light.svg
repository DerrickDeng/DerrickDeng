<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Agentic QA workflow</title>
<desc id="desc">A Jira story becomes traceable BDD tests in ai-native-test-design, becomes Playwright automation in ai-native-ui-automation, and runs against qa-dashboard, with guardrails underneath.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818b98"/></marker></defs>
<rect x="10" y="66.0" width="152" height="76" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="86" y="98.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Jira story</text>
<text x="86" y="120.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">+ acceptance criteria</text>
<line x1="162" y1="104.0" x2="187" y2="104.0" stroke="#818b98" stroke-width="2" marker-end="url(#a)"/>
<rect x="190" y="40" width="215" height="128" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="297.5" y="70" font-size="16" font-weight="700" fill="#0550ae" text-anchor="middle">ai-native-test-design</text>
<text x="297.5" y="100" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">What to test</text>
<text x="297.5" y="122" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">Where to automate</text>
<text x="297.5" y="144" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">How much to regress</text>
<line x1="405" y1="104.0" x2="430" y2="104.0" stroke="#818b98" stroke-width="2" marker-end="url(#a)"/>
<rect x="433" y="66.0" width="117" height="76" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="491.5" y="98.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Traceable</text>
<text x="491.5" y="120.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">BDD .feature</text>
<line x1="550" y1="104.0" x2="575" y2="104.0" stroke="#818b98" stroke-width="2" marker-end="url(#a)"/>
<rect x="578" y="40" width="227" height="128" rx="12" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
<text x="691.5" y="70" font-size="16" font-weight="700" fill="#6639ba" text-anchor="middle">ai-native-ui-automation</text>
<text x="691.5" y="100" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">Implement missing steps</text>
<text x="691.5" y="122" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">Heal broken tests</text>
<text x="691.5" y="144" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">Playwright + playwright-bdd</text>
<line x1="805" y1="104.0" x2="830" y2="104.0" stroke="#818b98" stroke-width="2" marker-end="url(#a)"/>
<rect x="833" y="40" width="157" height="128" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="911.5" y="70" font-size="16" font-weight="700" fill="#116329" text-anchor="middle">qa-dashboard</text>
<text x="911.5" y="100" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">App under test</text>
<text x="911.5" y="122" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">Execution</text>
<text x="911.5" y="144" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">AI effectiveness</text>
<rect x="330" y="222" width="340" height="58" rx="12" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500.0" y="246" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Requirement Wiki</text>
<text x="500.0" y="267" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">every rule cites its source story</text>
<line x1="297" y1="170" x2="370" y2="220" stroke="#818b98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="300" y="212" font-size="12" font-weight="400" fill="#59636e" text-anchor="end">requirements compiled into</text>
<line x1="630" y1="220" x2="691" y2="170" stroke="#818b98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="700" y="212" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">business rules for new steps</text>
<rect x="10" y="305" width="980" height="150" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="30" y="337" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Guardrails the agents cannot skip</text>
<text x="970" y="337" font-size="13" font-weight="400" fill="#59636e" text-anchor="end">checked by lint, contract tests, and evals</text>
<rect x="30.0" y="357" width="230" height="76" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<circle cx="52.0" cy="384" r="9" fill="#1a7f37"/>
<path d="M47.5,384 l3.2,3.4 l6,-6.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70.0" y="389" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Spec is frozen</text>
<text x="48.0" y="414" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Gherkin is never edited to pass</text>
<rect x="266.66666666666663" y="357" width="230" height="76" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<circle cx="288.66666666666663" cy="384" r="9" fill="#1a7f37"/>
<path d="M284.16666666666663,384 l3.2,3.4 l6,-6.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="306.66666666666663" y="389" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Evidence-based locators</text>
<text x="284.66666666666663" y="414" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">every locator traces to tool output</text>
<rect x="503.3333333333333" y="357" width="230" height="76" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<circle cx="525.3333333333333" cy="384" r="9" fill="#1a7f37"/>
<path d="M520.8333333333333,384 l3.2,3.4 l6,-6.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="543.3333333333333" y="389" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Failures stay visible</text>
<text x="521.3333333333333" y="414" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">no skip, retry, or fixed wait</text>
<rect x="740.0" y="357" width="230" height="76" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
<circle cx="762.0" cy="384" r="9" fill="#1a7f37"/>
<path d="M757.5,384 l3.2,3.4 l6,-6.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="780.0" y="389" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Explicit remote writes</text>
<text x="758.0" y="414" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">nothing reaches Jira by accident</text>
</svg>
